apiVersion: 1

providers:
  - name: careguide
    folder: CareGuide
    type: file
    disableDeletion: true
    allowUiUpdates: false # dashboards are code; change the JSON in git, not in the UI
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
