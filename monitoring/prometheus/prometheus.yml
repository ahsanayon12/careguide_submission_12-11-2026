global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: careguide-local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    # Only running with `--profile alerting`; Prometheus just logs a warning otherwise.
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: careguide-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: careguide-api

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Keep only per-container series (drop cgroup hierarchy series with no container name).
      - source_labels: [name]
        regex: ""
        action: drop

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
