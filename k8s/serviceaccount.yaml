kind: ServiceAccount
metadata:
  name: careguide-api
  labels:
    app.kubernetes.io/name: careguide-api
  # On EKS this is where IRSA / Pod Identity is attached:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/careguide-api
automountServiceAccountToken: false # the app never talks to the Kubernetes API
