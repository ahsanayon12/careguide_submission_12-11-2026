# EXAMPLE ONLY - not referenced by kustomization.yaml and contains no real values.
#
# Create the real Secret out-of-band so plaintext never lands in git:
#
#   kubectl -n careguide create secret generic careguide-secrets \
#     --from-literal=API_TOKEN="$(openssl rand -hex 32)"
#
# Production options (see README): Sealed Secrets (encrypted SealedSecret committed to git),
# SOPS + age/KMS, or External Secrets Operator syncing from AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: careguide-secrets
  namespace: careguide
type: Opaque
stringData:
  API_TOKEN: "<replace-me>"
