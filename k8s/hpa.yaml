# Requires metrics-server (see README for the kind install command).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: careguide-api
  labels:
    app.kubernetes.io/name: careguide-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: careguide-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # % of the CPU *request* (50m)
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300 # avoid flapping after a burst
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
