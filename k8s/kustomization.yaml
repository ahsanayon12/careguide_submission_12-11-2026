apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: careguide

labels:
  - pairs:
      app.kubernetes.io/part-of: careguide
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  # NOTE: the Secret is intentionally NOT listed here. It is created out-of-band
  # (kubectl create secret / Sealed Secrets / External Secrets) - see README "Secrets".

# Change the deployed version in one place:
#   cd k8s && kustomize edit set image careguide-api=careguide-api:1.1.0
images:
  - name: careguide-api
    newName: careguide-api
    newTag: 1.0.0
