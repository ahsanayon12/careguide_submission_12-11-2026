name: Deploy to EC2 (reusable)

# Deploys an image tag to the EC2 instance of one environment via AWS SSM Run Command.
# The on-host script (/opt/careguide/deploy.sh, installed by Terraform user data) pulls the new
# image, restarts the container, smoke-tests /health and rolls back to the previous tag on failure.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      image_tag:
        description: Image tag to deploy (e.g. sha-abc1234) - also used for manual rollback
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
      url: http://${{ steps.target.outputs.public_ip }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Find target instance
        id: target
        run: |
          read -r INSTANCE_ID PUBLIC_IP < <(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=careguide" \
                      "Name=tag:Environment,Values=${{ inputs.environment }}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].[InstanceId,PublicIpAddress]' --output text)
          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "::error::No running instance for environment ${{ inputs.environment }}"; exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM (on-host smoke test + automatic rollback)
        id: ssm
        env:
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${IMAGE_TAG} (${GITHUB_SHA::7})" \
            --parameters "commands=[\"sudo /opt/careguide/deploy.sh ${IMAGE_TAG}\"]" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"

          # Poll until finished (aws ssm wait gives up after ~100s).
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [[ "$STATUS" != "Success" ]]; then
            echo "::error::Deploy failed (status: $STATUS). The host script rolled back to the previous image."
            exit 1
          fi

      - name: External smoke test
        env:
          PUBLIC_IP: ${{ steps.target.outputs.public_ip }}
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "http://${PUBLIC_IP}/health"; then
              echo; curl -fsS "http://${PUBLIC_IP}/"; echo
              exit 0
            fi
            echo "attempt $i failed, retrying..."; sleep 3
          done
          echo "::error::External smoke test failed - triggering rollback"
          aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --parameters 'commands=["sudo /opt/careguide/deploy.sh --rollback"]' >/dev/null
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "### ${{ inputs.environment }}: \`${{ inputs.image_tag }}\` -> ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
