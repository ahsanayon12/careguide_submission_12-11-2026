name: Build, push & deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-deploy
  cancel-in-progress: false # never cancel a deploy half-way

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }} # e.g. careguide-api

jobs:
  build-push:
    name: Build multi-arch image & push to ECR
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS STS, no long-lived keys
    outputs:
      image: ${{ steps.image.outputs.repo }}:${{ steps.meta.outputs.sha_tag }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute tags
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        id: image
        run: echo "repo=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Gate: re-scan the exact code going to production before pushing anything.
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: scan:${{ github.sha }}
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Build & push multi-arch image (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.image.outputs.repo }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.image.outputs.repo }}:${{ steps.meta.outputs.version }}
            ${{ steps.image.outputs.repo }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bonus: keyless signing with the workflow's OIDC identity (Sigstore). SBOM + provenance
      # attestations are attached by buildx above (sbom: true, provenance: true).
      - uses: sigstore/cosign-installer@v3

      - name: Sign image (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REPO: ${{ steps.image.outputs.repo }}
        run: cosign sign --yes "${REPO}@${DIGEST}"

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo "- \`${{ steps.image.outputs.repo }}:${{ steps.meta.outputs.sha_tag }}\`"
            echo "- \`${{ steps.image.outputs.repo }}:${{ steps.meta.outputs.version }}\`"
            echo "- digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy to staging
    needs: build-push
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_tag: ${{ needs.build-push.outputs.sha_tag }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  deploy-production:
    name: Deploy to production
    needs: [build-push, deploy-staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production # protected GitHub Environment => required reviewer approval
      image_tag: ${{ needs.build-push.outputs.sha_tag }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
